<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanktionsgenerator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0f0f0f;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 320px;
            background-color: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            white-space: nowrap;
        }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }
        .nav-btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            text-align: left;
            background: transparent;
            color: #9ca3af;
        }
        .nav-btn:hover {
            color: #e5e7eb;
        }
        .nav-btn.active {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
        }
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #d1d5db;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 0.375rem;
            color: white;
            font-family: inherit;
            margin-bottom: 1rem;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #2a2a2a;
        }
        textarea {
            resize: none;
            min-height: 5rem;
        }
        .sanktionen-box {
            background-color: #1a1a1a;
            padding: 1rem;
            border-radius: 0.375rem;
            border: 1px solid #2a2a2a;
            margin-bottom: 1rem;
        }
        .sanktionen-box h3 {
            font-weight: 600;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }
        .checkbox-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            margin: 0;
            flex-shrink: 0;
        }
        .checkbox-group input[type="text"] {
            flex: 1;
            margin: 0;
            font-size: 0.875rem;
        }
        .checkbox-group label {
            margin: 0;
            font-size: 0.875rem;
            color: #9ca3af;
        }
        button.primary {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        button.primary:hover {
            background-color: #1d4ed8;
        }
        button.secondary {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }
        button.secondary:hover {
            background-color: #15803d;
        }
        .preview {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 0.375rem;
            padding: 1rem;
            min-height: 24rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            color: #d1d5db;
        }
        .footer {
            color: #6b7280;
            font-size: 0.75rem;
            border-top: 1px solid #2a2a2a;
            padding-top: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🔵 SANKTIONSGENERATOR</h1>
            <nav class="nav">
                <button class="nav-btn active" onclick="switchTab('sanktion')">📋 Sanktion</button>
                <button class="nav-btn" onclick="switchTab('akte')">📁 Akte</button>
                <button class="nav-btn" onclick="switchTab('suspendierung')">⛔ Suspendierung</button>
            </nav>
            <div class="footer">
                <p>Sanktionsgenerator</p>
                <p>v1.0.0</p>
            </div>
        </div>

        <div class="main">
            <!-- Sanktion Tab -->
            <div id="sanktion" class="section active">
                <h2>📋 Sanktion Generator</h2>
                <div class="grid">
                    <div>
                        <label>Name des Beschuldigten</label>
                        <input type="text" id="name" placeholder="Vorname Nachname">

                        <label>Spieler ID</label>
                        <input type="text" id="spielerId" placeholder="z.B. 12345">

                        <label>Verstoß</label>
                        <textarea id="beschuldigung" placeholder="z.B. §1.0 Respektloses Verhalten"></textarea>

                        <div class="sanktionen-box">
                            <h3>Sanktionen</h3>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_hl">
                                <input type="text" id="val_hl" placeholder="min">
                                <label>Humane Labs</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_ng">
                                <input type="text" id="val_ng" placeholder="x">
                                <label>NG-Runden</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_lobby">
                                <input type="text" id="val_lobby" placeholder="min">
                                <label>Lobbyarbeit</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_geld">
                                <input type="text" id="val_geld" placeholder="$">
                                <label>Geldstrafe</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_strike">
                                <input type="text" id="val_strike" placeholder="x">
                                <label>Strike</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="cb_kuen">
                                <label>Kündigung</label>
                            </div>
                        </div>

                        <label>Ihr Name</label>
                        <input type="text" id="autorName" placeholder="">

                        <label>Abteilung</label>
                        <input type="text" id="abteilung" placeholder="z.B. Intelligence Unit">

                        <label>Rang/Rolle</label>
                        <input type="text" id="rolle" placeholder="">

                        <button class="primary" onclick="generateSanktion()">✓ Sanktion Generieren</button>
                    </div>

                    <div>
                        <label>📋 Vorschau Discord</label>
                        <div class="preview" id="preview"></div>
                        <button class="secondary" onclick="copySanktion()" id="copyBtn" style="display: none;">📋 Kopieren</button>
                    </div>
                </div>
            </div>

            <!-- Akte Tab -->
            <div id="akte" class="section">
                <h2>📁 Akten-Archiv</h2>
                <p style="color: #6b7280;">Akten-Archiv - Coming Soon 🚧</p>
            </div>

            <!-- Suspendierung Tab -->
            <div id="suspendierung" class="section">
                <h2>⛔ Suspendierungs-Formular</h2>
                <div style="max-width: 40rem;">
                    <div style="background-color: #1a1a1a; padding: 1.5rem; border: 1px solid #2a2a2a; border-radius: 0.375rem;">
                        <label>Vor- u. Nachname</label>
                        <input type="text" placeholder="Name">

                        <label>Reisepassnummer (ID)</label>
                        <input type="text" placeholder="Spieler ID">

                        <label>Grund</label>
                        <textarea placeholder="Grund der Suspendierung"></textarea>

                        <label>Sanktion: [Discord Post Link]</label>
                        <input type="text" placeholder="Discord Nachrichtslink">

                        <label>Ehem. Rang</label>
                        <select>
                            <option>– Rang wählen –</option>
                            <option>01. Officer</option>
                            <option>02. Senior Officer</option>
                            <option>03. Inspector</option>
                            <option>04. Senior Inspector</option>
                            <option>05. Lieutenant</option>
                        </select>

                        <p style="color: #9ca3af; font-size: 0.875rem; margin-bottom: 0.5rem;">Aktueller Rang:</p>
                        <p style="font-size: 1.125rem; font-weight: 600; color: #2563eb; margin-bottom: 1rem;">02. Sanctioned Officer</p>

                        <label>Zeitraum</label>
                        <input type="text" placeholder="Bis Sanktion erfüllt ist" value="Bis Sanktion erfüllt ist">

                        <button class="primary">✓ Suspendierung Registrieren</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function generateSanktion() {
            const name = document.getElementById('name').value;
            const beschuldigung = document.getElementById('beschuldigung').value;
            
            if (!name || !beschuldigung) {
                alert('Bitte fülle Name und Verstoß aus!');
                return;
            }

            let strafenList = [];
            if (document.getElementById('cb_hl').checked && document.getElementById('val_hl').value) {
                strafenList.push(`- ${document.getElementById('val_hl').value}min Humane Labs`);
            }
            if (document.getElementById('cb_ng').checked && document.getElementById('val_ng').value) {
                strafenList.push(`- ${document.getElementById('val_ng').value}x NG-Runden`);
            }
            if (document.getElementById('cb_lobby').checked && document.getElementById('val_lobby').value) {
                strafenList.push(`- ${document.getElementById('val_lobby').value}min Lobbyarbeit`);
            }
            if (document.getElementById('cb_geld').checked && document.getElementById('val_geld').value) {
                strafenList.push(`- $${parseInt(document.getElementById('val_geld').value).toLocaleString('de-DE')},- Geldstrafe`);
            }
            if (document.getElementById('cb_strike').checked && document.getElementById('val_strike').value) {
                strafenList.push(`- ${document.getElementById('val_strike').value}x Strike`);
            }
            if (document.getElementById('cb_kuen').checked) {
                strafenList.push(`- Kündigung`);
            }

            const autorName = document.getElementById('autorName').value || '(Name)';
            const abteilung = document.getElementById('abteilung').value || '(Abteilung)';
            const rolle = document.getElementById('rolle').value || '(Rolle)';

            const text = `Sehr geehrter @${name},

Ihnen wurde eine Sanktion in Folge vorliegender Beweise ausgestellt.

Verstoß:
> - ${beschuldigung}

Strafe:
${strafenList.map(s => `> ${s}`).join('\n')}

Sollte die Sanktion innerhalb **48h** nicht beglichen sein, muss mit weiteren Schritten gerechnet werden.
Bis sie die Sanktion abgeleistet haben erhalten sie **Rang 2**. Achten sie beim Abarbeiten auf eine gültige verwertbare Bodycam!
In Sanktionen wird **NICHT** unnötig kommentiert.

Mit freundlichen Grüßen,
@${autorName}
-# ${abteilung}
-# ${rolle}`;

            document.getElementById('preview').textContent = text;
            document.getElementById('copyBtn').style.display = 'block';
        }

        function copySanktion() {
            const text = document.getElementById('preview').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ In Zwischenablage kopiert!');
            });
        }
    </script>
</body>
</html>
