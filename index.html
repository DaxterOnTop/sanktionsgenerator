<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanktionsgenerator - LSPD IU</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: #0f1419;
            border-bottom: 1px solid #2a3142;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-title h1 { font-size: 18px; font-weight: 700; }
        .header-title p { font-size: 12px; color: #888; }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .status-badge { background: #1a5c3a; padding: 4px 10px; border-radius: 4px; font-size: 11px; }

        /* Main container */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: #0f1419;
            border-right: 1px solid #2a3142;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background: #151a28;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            margin-bottom: 8px;
        }

        input::placeholder { color: #666; }

        .violations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            margin-bottom: 10px;
        }

        .violations-list {
            border: 1px solid #2a3142;
            background: #0a0e27;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .violation-item {
            padding: 8px;
            border-radius: 3px;
            margin-bottom: 4px;
            background: #151a28;
            cursor: pointer;
            transition: background 0.2s;
        }

        .violation-item:hover { background: #1a2038; }

        .violation-item label {
            display: block;
            cursor: pointer;
            font-size: 12px;
        }

        .violation-item input[type="checkbox"] {
            width: auto;
            margin-right: 6px;
            margin-bottom: 0;
            cursor: pointer;
        }

        .violation-code {
            font-weight: 600;
            color: #4a9eff;
        }

        .violation-penalties {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
            margin-left: 20px;
            line-height: 1.3;
        }

        .generate-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            margin-top: auto;
            transition: background 0.2s;
        }

        .generate-btn:hover { background: #1d4ed8; }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            background: #0f1419;
            border-bottom: 1px solid #2a3142;
            display: flex;
            padding: 0 20px;
            gap: 20px;
        }

        .tab {
            padding: 12px 0;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
        }

        .tab.active {
            color: #4a9eff;
            border-bottom-color: #4a9eff;
        }

        /* Sanctions bar */
        .sanctions-bar {
            background: #0f1419;
            border-bottom: 1px solid #2a3142;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 12px;
        }

        .sanction-input {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sanction-input label {
            font-size: 11px;
            white-space: nowrap;
            min-width: 80px;
        }

        .sanction-input input, .sanction-input select {
            width: 80px;
            padding: 5px 8px;
            font-size: 11px;
        }

        /* Content area */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .content-area.tab-akte,
        .content-area.tab-suspension {
            grid-template-columns: 1fr;
        }

        .input-box, .preview-box {
            background: #151a28;
            border: 1px solid #2a3142;
            border-radius: 6px;
            padding: 16px;
        }

        .preview-box {
            background: #0a0e27;
            border: 2px dashed #2a3142;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #0f1419;
            border: 1px solid #2a3142;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            resize: none;
            font-weight: 400;
        }

        .preview-content {
            background: #0f1419;
            border: 1px solid #2a3142;
            padding: 12px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .copy-btn:hover { background: #059669; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3142;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4152;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
        }

        /* Date display */
        .date-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-title">
                <h1>🛡️ Sanktionsgenerator</h1>
                <p>Los Santos Police Department</p>
            </div>
        </div>
        <div class="header-right">
            <span class="status-badge">✓ Online</span>
        </div>
        <div class="date-display">Stand: 04.06.2026</div>
    </header>

    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-label">👤 Beamte Informationen</div>
                <input type="text" id="officerName" placeholder="Daxter Kush" value="Daxter Kush">
                <input type="text" id="officerId" placeholder="110812" value="110812">
                <select id="officerRank">
                    <option value="Director of I.U.">Director of I.U.</option>
                    <option value="Dep. Director of I.U.">Dep. Director of I.U.</option>
                    <option value="I.U. Supervising Commander">I.U. Supervising Commander</option>
                    <option value="I.U. Commander">I.U. Commander</option>
                    <option value="I.U. Senior Investigator">I.U. Senior Investigator</option>
                    <option value="I.U. Investigator">I.U. Investigator</option>
                    <option value="I.U. Recruit">I.U. Recruit</option>
                </select>
                <input type="text" id="officerRole" placeholder="I.A. Member, Leaderschafft">
            </div>

            <div class="sidebar-section">
                <div class="violations-header">
                    <div class="sidebar-label">⚖️ Verstöße</div>
                </div>
                <input type="text" id="violationSearch" class="search-box" placeholder="Suche...">
                <div class="violations-list" id="violationsList"></div>
            </div>

            <button class="generate-btn" onclick="generateSanction()">SANKTION GENERIEREN 📋</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('vorschau')">Vorschau</div>
                <div class="tab" onclick="switchTab('akte')">Akte</div>
                <div class="tab" onclick="switchTab('suspension')">Suspendierung</div>
            </div>

            <!-- SANCTION ADJUSTMENTS BAR -->
            <div class="sanctions-bar" id="sanctionsBar" style="display: none;">
                <div class="sanction-input">
                    <label>⏱️ Humane Labs</label>
                    <input type="number" id="hlTime" min="0" max="60" value="0" step="5"> min
                </div>
                <div class="sanction-input">
                    <label>🚑 EMS-Dienst</label>
                    <input type="number" id="emsTime" min="0" max="90" value="0" step="5"> min
                </div>
                <div class="sanction-input">
                    <label>🔄 NG-Runden</label>
                    <input type="number" id="ngRounds" min="0" max="5" value="0" step="1">
                </div>
                <div class="sanction-input">
                    <label>💸 Geldstrafe</label>
                    <select id="fineAmount">
                        <option value="0">Keine</option>
                        <option value="10000">$10.000</option>
                        <option value="20000">$20.000</option>
                        <option value="30000">$30.000</option>
                        <option value="40000">$40.000</option>
                        <option value="50000">$50.000</option>
                        <option value="60000">$60.000</option>
                        <option value="70000">$70.000</option>
                        <option value="80000">$80.000</option>
                        <option value="90000">$90.000</option>
                        <option value="100000">$100.000</option>
                    </select>
                </div>
                <div class="sanction-input">
                    <label>⚠️ Strike</label>
                    <input type="checkbox" id="strikeCheck">
                </div>
                <div class="sanction-input">
                    <label>🔴 Kündigung</label>
                    <input type="checkbox" id="terminationCheck">
                </div>
            </div>

            <!-- CONTENT AREA -->
            <div class="content-area" id="contentArea">
                <div class="input-box">
                    <div class="sidebar-label">Grund der Sanktion (optional)</div>
                    <textarea id="violationReason" placeholder="Zusätzliche Anmerkungen zur Sanktion..."></textarea>
                </div>
                <div class="preview-box">
                    <div class="sidebar-label">📋 Sanktion (Vorschau)</div>
                    <div class="preview-content" id="preview"></div>
                    <button class="copy-btn" onclick="copySanction()">📋 In Zwischenablage kopieren</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // COMPLETE LSPD SANCTIONS CATALOG
        const sanctions = [

            { code: '1.0', title: 'Respektloses Verhalten', category: 'Zwischenmenschlicher Umgang', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '1.1', title: 'Befehlsverweigerung (ggü. ranghöheren, Einsatzteilung oder Leitstelle)', category: 'Zwischenmenschlicher Umgang', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000, ✓ Strike, ✓ Kündigung' },

            { code: '1.5', title: 'Stören / Mithören von Privatgesprächen ohne Erlaubnis', category: 'Zwischenmenschlicher Umgang', penalties: 'max. 30min HL, max. 30min EMS, max. 5x NG, max. $50.000, (✓) Strike optional' },
            { code: '1.6', title: 'Diffamieren anderer staatlicher Organisationen', category: 'Zwischenmenschlicher Umgang', penalties: 'max. 60min HL, max. 60min EMS, max. 3x NG, max. $100.000, ✓ Strike' },
            { code: '1.7', title: 'Unerlaubtes Tackeln / am Boden fesseln', category: 'Zwischenmenschlicher Umgang', penalties: 'max. 60min HL, max. 60min EMS, max. 5x NG, max. $100.000, ✓ Strike, (✓) Kündigung optional' },

            // 2. Dienstvergehen
            { code: '2.0', title: 'Missachtung der Dienstpflicht (18:00 – 22:00 Uhr, Wochends 18:00 – 23:00 Uhr)', category: 'Dienstvergehen', penalties: 'max. 30min HL, max. 30min EMS, max. 3x NG, max. $50.000' },

            { code: '2.3', title: 'Das Tragen von komplett schwarz tätowierten Armen / Füßen', category: 'Dienstvergehen', penalties: 'max. 30min HL, (kein EMS), max. 5x NG, max. $50.000' },
            { code: '2.4', title: 'Das befahren des Ghettos im Dienst ohne Berechtigung / Spezialbeamte', category: 'Dienstvergehen', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '2.5', title: 'Missbrauch des Tazers / sinnloses Tazern', category: 'Dienstvergehen', penalties: 'max. 45min HL, max. 45min EMS, max. 5x NG, max. $100.000, ✓ Strike' },
            { code: '2.6', title: 'Schlafen am/im HQ (Ausnahme: Pausenraum)', category: 'Dienstvergehen', penalties: 'max. 30min HL, max. 30min EMS, max. 3x NG, max. $30.000' },
            { code: '2.7', title: 'Festnahme von Personen ohne Begründung / Verdacht / Missbrauch der Handschellen', category: 'Dienstvergehen', penalties: 'max. 60min HL, max. 60min EMS, max. 5x NG, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '2.8', title: 'Markierte Mitarbeiter vor fremden / externen Personen mit dem Namen ansprechen', category: 'Dienstvergehen', penalties: 'max. 30min HL, max. 30min EMS, max. 3x NG, max. $30.000' },
            { code: '2.9', title: 'Ergreifen ohne Genehmigung', category: 'Dienstvergehen', penalties: 'max. 30min HL, max. 45min EMS, max. 5x NG, max. $50.000' },
            { code: '2.10', title: 'Unverhältnismäßige Waffengewalt gegenüber Wehrlosen', category: 'Dienstvergehen', penalties: 'max. 60min HL, max. 60min EMS, max. 5x NG, max. 7 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '2.11', title: 'Parken von Privatfahrzeugen auf dem Gelände des LSPDs (Ausnahme: Vorgeshende Parkplätze)', category: 'Dienstvergehen', penalties: 'max. 15min HL, (kein EMS), max. 1x NG, max. $30.000' },
            { code: '2.12', title: 'Nicht schießen der Türen', category: 'Dienstvergehen', penalties: '(kein HL), (kein EMS), max. 1x NG, max. $30.000' },

            { code: '4.8', title: 'Entsorgung von Waffen, Munition, Westen und Masken der Organisation außerhalb des Lagers', category: 'Vergehren im Bezug auf Ausrüstung, Kleidung und Fahrzeuge', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000' },

            { code: '5.0', title: 'Nicht Anfahren von Event, Globals, Locals, Shoproaubs und 11-99 ohne wichtigen Grund und Anmeldung im Chat Funk', category: 'Einsatzvergehen', penalties: 'max. 30min HL, max. 45min EMS, max. 2x NG, max. $100.000' },
            { code: '5.1', title: 'Betreten von Grundstücken ohne Durchsuchungsbefehl ist verboten, ausgenommen es ist Gefahr im Vollzug / Strafbestand', category: 'Einsatzvergehen', penalties: 'max. 30min HL, max. 30min EMS, max. 3x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '5.2', title: 'Anstiftung zu einem internen Regelverstoß', category: 'Einsatzvergehen', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '5.3', title: 'Fahrzeugaufbau / Einsatz entfernen einer Stoppauforderung oder Motorblocker auf Kollegen', category: 'Einsatzvergehen', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000' },
            { code: '5.4', title: 'Vom Konvoi / Einsatz entfernen ohne Genehmigung', category: 'Einsatzvergehen', penalties: 'max. 30min HL, max. 30min EMS, max. 2x NG, max. $50.000, (✓) Strike optional' },
            { code: '5.5', title: 'Tanzen / unangemessenes Verhalten / reden bei Einsätzen / Aufstellungen / Events', category: 'Einsatzvergehen', penalties: 'max. 30min HL, max. 60min EMS, max. 2x NG, max. $50.000' },
            { code: '5.6', title: 'Störeinsätze / wichtiger Einsatz - Kontrollen, Verhaftungen', category: 'Einsatzvergehen', penalties: 'max. 30min HL, max. 45min EMS, max. 2x NG, max. $100.000' },

            // 6. Schwerwegende Vergehren
            { code: '6.0', title: 'Diffamieren des LSPDs im Dienst sowie außer Dienst', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '6.1', title: 'Nicht erfüllen von Strafen innerhalb von 48 Stunden (Zählen von Bußgeldern, Humane Labs Dienst, NG Runden)', category: 'Schwerwegende Vergehren', penalties: 'Strike oder Kündigung' },
            { code: '6.2', title: 'Entfernen von Wanteds ohne die Befugnis', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '6.3', title: 'Betreten / Gaffen / Aufenthalt bei Einsatzstellen außerhalb des Dienstes', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '6.4', title: 'Datenschutzverletzung', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '6.5', title: 'Bewerbung bei einer anderen Organisation ohne vorheriger Absprache mit der HR - Leitung / Leaderschafft', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike' },
            { code: '6.6', title: 'Unangebrachtes Fehlen als 72 Stunden (+weitere Kulanz möglich) "Strike oder Kündigung"', category: 'Schwerwegende Vergehren', penalties: 'Strike oder Kündigung' },
            { code: '6.7', title: 'Fehlende Bodycam bei Anfrage der Justiz, oder intern zugelassenen Personen/Abteilungen', category: 'Schwerwegende Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. $100.000, ✓ Strike, (✓) Kündigung optional' },
            { code: '6.8', title: 'Mangelnde Aktivität/Initiative, Mangelnde Logaktivität', category: 'Schwerwegende Vergehren', penalties: 'Strike oder Kündigung' },

            // 7. Sonstige Vergehren
            { code: '7.0', title: 'Sonstiges Vergehren (Variabel)', category: 'Sonstige Vergehren', penalties: 'max. 60min HL, max. 90min EMS, max. 5x NG, max. 14 Tage Upranksperre, max. $100.000, ✓ Strike, ✓ Kündigung' },
            { code: '7.1', title: 'Mehrfache Sanktionen in der letzten Zeit, mit dem selben Sanktionsgrund', category: 'Sonstige Vergehren', penalties: 'Strike oder Kündigung' }
        ];

        let selectedViolations = [];

        // Initialize violations list
        function initializeViolations() {
            const list = document.getElementById('violationsList');
            list.innerHTML = '';
            sanctions.forEach(sanction => {
                const item = document.createElement('div');
                item.className = 'violation-item';
                item.innerHTML = `
                    <label>
                        <input type="checkbox" class="violation-checkbox" data-code="${sanction.code}" 
                               onchange="updateSelectedViolations()">
                        <span class="violation-code">§${sanction.code}</span> ${sanction.title}
                    </label>
                    <div class="violation-penalties">${sanction.penalties}</div>
                `;
                list.appendChild(item);
            });
        }

        // Search violations
        document.getElementById('violationSearch').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            document.querySelectorAll('.violation-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(search) ? 'block' : 'none';
            });
        });

        // Update selected violations
        function updateSelectedViolations() {
            selectedViolations = [];
            document.querySelectorAll('.violation-checkbox:checked').forEach(checkbox => {
                const code = checkbox.dataset.code;
                selectedViolations.push(sanctions.find(s => s.code === code));
            });
            document.getElementById('sanctionsBar').style.display = selectedViolations.length > 0 ? 'flex' : 'none';
            updatePreview();
        }

        // Generate sanction
        function generateSanction() {
            if (selectedViolations.length === 0) {
                alert('Bitte mindestens einen Verstoß auswählen!');
                return;
            }

            const name = document.getElementById('officerName').value;
            const id = document.getElementById('officerId').value;
            const role = document.getElementById('officerRole').value;
            const reason = document.getElementById('violationReason').value;

            const hlTime = parseInt(document.getElementById('hlTime').value) || 0;
            const emsTime = parseInt(document.getElementById('emsTime').value) || 0;
            const ngRounds = parseInt(document.getElementById('ngRounds').value) || 0;
            const fineAmount = parseInt(document.getElementById('fineAmount').value) || 0;
            const hasStrike = document.getElementById('strikeCheck').checked;
            const hasTermination = document.getElementById('terminationCheck').checked;

            let violations = selectedViolations.map(v => `> - §${v.code} ${v.title}`).join('\n');

            let punishments = [];
            if (hlTime > 0) punishments.push(`${hlTime}min Humane Labs`);
            if (emsTime > 0) punishments.push(`${emsTime}min EMS-Dienst`);
            if (ngRounds > 0) punishments.push(`${ngRounds}x NG-Runde${ngRounds > 1 ? 'n' : ''}`);
            if (fineAmount > 0) punishments.push(`$${fineAmount.toLocaleString('de-DE')},- Geldstrafe`);
            if (hasStrike) punishments.push('1x Strike');
            if (hasTermination) punishments.push('Kündigung');

            let punishmentText = punishments.map(p => `> - ${p}`).join('\n');

            const sanction = `Sehr geehrter @${name},

Ihnen wurde eine Sanktion in Folge vorliegender Beweise ausgestellt.

Verstoß:
${violations}

Strafe:
${punishmentText}

Sollte die Sanktion innerhalb **48h** nicht beglichen sein, muss mit weiteren Schritten gerechnet werden.
Bis sie die Sanktion abgeleistet haben erhalten sie **Rang 2**. Achten sie beim Abarbeiten auf eine gültige verwertbare Bodycam!
In Sanktionen wird **NICHT** unnötig kommentiert.

Mit freundlichen Grüßen,
${name} | ${id}
-# Intelligence Unit
-# ${role}`;

            document.getElementById('preview').textContent = sanction;
        }

        // Update preview on input change
        function updatePreview() {
            generateSanction();
        }

        // Copy to clipboard
        function copySanction() {
            const preview = document.getElementById('preview').textContent;
            if (!preview) {
                alert('Bitte erst eine Sanktion generieren!');
                return;
            }
            navigator.clipboard.writeText(preview).then(() => {
                alert('✓ In Zwischenablage kopiert!');
            });
        }

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initializeViolations();
        });

        // Real-time updates
        document.getElementById('officerName').addEventListener('change', updatePreview);
        document.getElementById('officerId').addEventListener('change', updatePreview);
        document.getElementById('officerRole').addEventListener('change', updatePreview);
        document.getElementById('hlTime').addEventListener('change', updatePreview);
        document.getElementById('emsTime').addEventListener('change', updatePreview);
        document.getElementById('ngRounds').addEventListener('change', updatePreview);
        document.getElementById('fineAmount').addEventListener('change', updatePreview);
        document.getElementById('strikeCheck').addEventListener('change', updatePreview);
        document.getElementById('terminationCheck').addEventListener('change', updatePreview);
    </script>
</body>
</html>
